name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v5
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Verify build output
        run: |
          test -f public/index.html || { echo "::error::缺少 public/index.html"; exit 1; }
          test -f public/assets/bundles/function.main.js || { echo "::error::缺少 JS bundle"; exit 1; }
          test -f public/assets/bundles/style.main.css || { echo "::error::缺少 CSS bundle"; exit 1; }
          echo "构建产物校验通过"
