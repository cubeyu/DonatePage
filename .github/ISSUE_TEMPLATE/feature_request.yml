name: 功能建议
description: 提出一个新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请说明这个想法能解决什么问题。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前有什么不便？这个功能能改善什么？
      placeholder: 例如：想让捐赠页支持更多的支付渠道
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望它如何工作？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 有没有其他实现方式？为什么更倾向你的方案？
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 参考链接、草图、截图等
    validations:
      required: false
